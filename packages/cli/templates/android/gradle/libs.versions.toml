[versions]
agp = "9.2.1"
# The Kotlin Gradle plugin that AGP 9.2.1's built-in Kotlin applies.
kotlin = "2.2.10"
hotwire = "1.3.1"
# The versions Hotwire Native 1.3.1 resolves to: lower pins get upgraded
# anyway. Check with ./gradlew :app:dependencies after bumping Hotwire.
kotlinxSerializationJson = "1.8.1"
coreKtx = "1.16.0"
appcompat = "1.7.0"
material = "1.12.0"
activityKtx = "1.10.1"
constraintlayout = "2.2.1"

[libraries]
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
hotwire-core = { group = "dev.hotwire", name = "core", version.ref = "hotwire" }
hotwire-navigation-fragments = { group = "dev.hotwire", name = "navigation-fragments", version.ref = "hotwire" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
